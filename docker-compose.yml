services:
  gunpla-collector:
    image: ghcr.io/tr3mor/gunpla-collector:${GUNPLA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      GUNPLA_DB_PATH: /data/gunpla.db
      GUNPLA_TELEGRAM_BOT_TOKEN: ${GUNPLA_TELEGRAM_BOT_TOKEN}
      GUNPLA_TELEGRAM_CHAT_ID: ${GUNPLA_TELEGRAM_CHAT_ID}
      # Set in .env to restrict to specific shops, e.g.
      # GUNPLA_SHOPS=geeksheaven,gundamstore. Empty means "all" (see README).
      GUNPLA_SHOPS: ${GUNPLA_SHOPS:-}
      # Fallback USD->EUR rate for reports; today's rate is fetched at
      # startup and this is used only if that lookup fails.
      GUNPLA_USD_EUR_RATE: "${GUNPLA_USD_EUR_RATE:-}"
    volumes:
      - gunpla-data:/data

  # Search UI, separate from the cron container so it can be started,
  # stopped, or restarted independently. Reads the same SQLite file over
  # the shared volume (SQLite's WAL mode allows concurrent readers while
  # gunpla-collector holds a write transaction). No auth — bind it to a
  # trusted network (LAN/VPN), not the public internet.
  gunpla-ui:
    image: ghcr.io/tr3mor/gunpla-collector:${GUNPLA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Bypass docker-entrypoint.sh (which always execs crond) and run the
    # binary directly — this container has no cron jobs of its own.
    entrypoint: ["/usr/local/bin/gunpla-collector"]
    command: ["serve"]
    environment:
      GUNPLA_DB_PATH: /data/gunpla.db
      GUNPLA_UI_ADDR: ":8080"
      GUNPLA_USD_EUR_RATE: "${GUNPLA_USD_EUR_RATE:-}"
    ports:
      - "${GUNPLA_UI_PORT:-8080}:8080"
    volumes:
      - gunpla-data:/data

volumes:
  gunpla-data:
